body{
font-family:Arial,sans-serif;
background:#fff;
margin:0;
padding:0;

.navbar{
background:#fff;
padding:15px 0;

}

.navbar-brand img{
height:80px;
width:auto;
margin-top:-28px;
}

.navbar-nav li a{
font-weight:600;
color:#0d2c54 !important;
}

.hero{
background:
linear-gradient(rgba(13,44,84,0.75), rgba(13,44,84,0.75)),
url('img/slides/2.jpg');

background-size:cover;
background-position:center;
padding:150px 20px 100px;
text-align:center;
color:white;
}

.hero h1{
font-size:58px;
font-weight:700;
margin-bottom:20px;

.hero p{
font-size:22px;

.section{
padding:110px 20px;

.section-title{
text-align:center;
margin-bottom:70px;
}

.section-title h2{
font-size:46px;
font-weight:700;
color:#0d2c54;
}

.gallery-card{
position:relative;
overflow:hidden;
border-radius:24px;
margin-bottom:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
transition:0.4s;
}

.gallery-card:hover{
transform:translateY(-10px);
}

.gallery-card img{
width:100%;
height:320px;
object-fit:cover;
transition:0.5s;
}

.gallery-card:hover img{
transform:scale(1.08);
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(13,44,84,0.45);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transition:0.4s;
}

.gallery-card:hover .overlay{
opacity:1;
}

.overlay i{
font-size:42px;
color:white;
}

footer{
background:#0d2c54;
color:white;
padding:35px;
text-align:center;
margin-top:50px;
}

@media(max-width:768px){

.hero h1{
font-size:38px;
}

.hero p{
font-size:18px;
}

.navbar-brand img{
height:58px;
margin-top:-12px;
}

}

</style>
